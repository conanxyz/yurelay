name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build and publish as stable + Latest by default, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    if: (github.event_name == 'push' && !github.event.deleted) || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  prepare:
    name: Prepare private release draft
    needs: checks
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
      source_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate release version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release-version.py
      - name: Create or reuse a draft pinned to this commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/release.py prepare
  bundle:
    name: Bundle ${{ matrix.target }}
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      CARGO_INCREMENTAL: '0'
      # Preserve host proc-macro symbols on macOS; the app remains ad-hoc signed.
      CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP: none
      APPLE_SIGNING_IDENTITY: '-'
      # For notarized releases, configure repository secrets and replace '-' above:
      # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      # APPLE_ID: ${{ secrets.APPLE_ID }}
      # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust and architecture target
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain
          rustup target add "$RUST_TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: '. -> target'
          key: release-${{ matrix.target }}
      - run: npm ci
      - name: Build macOS installer
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: npm run tauri -- build --target "$RUST_TARGET" --bundles app,dmg
      - name: Upload installer and temporary architecture checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RUST_TARGET: ${{ matrix.target }}
        run: ./scripts/release-assets.sh
  publish:
    name: Verify all installers and publish
    # A failed or cancelled architecture build leaves the draft unpublished.
    needs: [prepare, bundle]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify both architectures and publish the completed draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: python3 scripts/release.py publish
