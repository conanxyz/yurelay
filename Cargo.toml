[workspace]
members = ["crates/core", "crates/platform", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
thiserror = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
